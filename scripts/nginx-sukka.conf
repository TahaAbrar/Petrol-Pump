# Sukka Group — same domain for frontend + backend
# Frontend (Node SSR) :8080  |  Backend (gunicorn) :8000
# Install: copy to /etc/nginx/sites-available/sukka && enable + reload
# SSL: certbot --nginx -d sukkagroupofcompanies.com -d www.sukkagroupofcompanies.com

upstream suka_frontend {
    server 127.0.0.1:8080;
    keepalive 32;
}

upstream suka_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name sukkagroupofcompanies.com www.sukkagroupofcompanies.com;

    client_max_body_size 50M;

    # Django API
    location /api/ {
        proxy_pass http://suka_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Uploaded media (proxied — project lives under /root, nginx cannot alias it)
    location /media/ {
        proxy_pass http://suka_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Optional Django admin (built-in) — React admin stays at /admin via frontend
    location /django-admin/ {
        proxy_pass http://suka_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://suka_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Everything else → React / TanStack SSR
    location / {
        proxy_pass http://suka_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
